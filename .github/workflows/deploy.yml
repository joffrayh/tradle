name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the bundled schedule picks up new days from tradle.net
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Reuse previously downloaded country files so daily builds only fetch
      # what's new instead of re-downloading ~220 files from tradle.net.
      - uses: actions/cache@v4
        with:
          path: public/countries
          key: tradle-countries-${{ github.run_id }}
          restore-keys: tradle-countries-
      # tradle.net doesn't allow cross-origin fetches, so bake its schedule and
      # country data into the build (falls back to the committed schedule).
      - name: Download tradle.net schedule and country data
        run: ./scripts/fetch-tradle-data.sh
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
