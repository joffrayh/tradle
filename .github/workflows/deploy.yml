name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the bundled schedule picks up new days from the official game
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh daily schedule from tradle.net
        # tradle.net doesn't allow cross-origin fetches, so the browser
        # can't read it directly. Bake the latest copy into the build instead,
        # falling back to the committed one if the download looks wrong.
        run: |
          if curl -fsSL https://tradle.net/data.csv -o /tmp/schedule.csv \
            && head -1 /tmp/schedule.csv | grep -q '^date,country' \
            && [ "$(wc -l < /tmp/schedule.csv)" -ge "$(wc -l < public/data.new.csv)" ]; then
            cp /tmp/schedule.csv public/data.new.csv
            echo "Using live schedule (last entry: $(tail -1 public/data.new.csv))"
          else
            echo "::warning::Could not refresh the daily schedule; using the committed copy"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
